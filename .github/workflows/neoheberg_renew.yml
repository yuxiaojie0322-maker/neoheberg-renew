name: NeoHeberg Auto Reboot & Keepalive

on:
  # 定时触发：每 3 天的 UTC 时间 03:20 执行一次 (对应北京时间 11:20)
  schedule:
    - cron: '20 3 */3 * *'
  # 支持在 GitHub Actions 页面手动点击运行
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: 执行登录与 VPS 重启保活任务
        env:
          # 多个账号可在 GitHub Repo -> Settings -> Secrets and variables -> Actions 中添加
          # 变量名: NEOHEBERG_ACCOUNTS
          # 格式支持 JSON: [{"username": "...", "password": "..."}, ...]
          # 或英文逗号分隔: yxj0322:YxJ223512@,user2:pass2
          NEOHEBERG_ACCOUNTS: ${{ secrets.NEOHEBERG_ACCOUNTS }}
          HEADLESS: "true"
        run: |
          python neoheberg_renew.py

      - name: 上传执行截图快照 (可供排查与确认)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neoheberg-screenshots
          path: "*.png"
          retention-days: 7
