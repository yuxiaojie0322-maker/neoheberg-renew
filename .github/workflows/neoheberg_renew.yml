name: NeoHeberg Auto Reboot & Keepalive

on:
  # 瀹氭椂瑙﹀彂锛氭瘡澶╃殑 UTC 鏃堕棿 03:20 鎵ц涓€娆?(瀵瑰簲鍖椾含鏃堕棿 11:20)
  schedule:
    - cron: '20 3 * * *'
  # 鏀寔鍦?GitHub Actions 椤甸潰鎵嬪姩鐐瑰嚮杩愯
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 妫€鍑哄叕寮€浠撳簱浠ｇ爜
        uses: actions/checkout@v4

      - name: 妫€鍑烘牳蹇冪鏈夎剼鏈粨搴?        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/my-private-scripts
          path: private-scripts
          token: ${{ secrets.CORE_SCRIPT_TOKEN || secrets.REPO_TOKEN || secrets.GH_PAT_PRIVATE_REPO }}

      - name: 璁剧疆 Python 鐜
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: private-scripts/neoheberg/requirements.txt

      - name: 瀹夎渚濊禆
        run: |
          python -m pip install --upgrade pip
          pip install -r private-scripts/neoheberg/requirements.txt
          playwright install --with-deps chromium

      - name: 鎵ц鐧诲綍涓?VPS 閲嶅惎淇濇椿浠诲姟
        env:
          NEOHEBERG_ACCOUNTS: ${{ secrets.NEOHEBERG_ACCOUNTS }}
          PROXY_NODE: ${{ secrets.PROXY_NODE }}
          NODE_LINK: ${{ secrets.NODE_LINK }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          HEADLESS: "true"
        run: |
          python -u private-scripts/neoheberg/neoheberg_renew.py

      - name: 涓婁紶鎵ц鎴浘蹇収 (鍙緵鎺掓煡涓庣‘璁?
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neoheberg-screenshots
          path: "*.png"
          retention-days: 7

      - name: 娓呯悊鏃х殑宸ヤ綔娴佽繍琛岃褰?(浠呬繚鐣欐渶鏂?鏉?
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          retain_days: 0
          keep_minimum_runs: 1